<!doctype html>
<html lang="nl">
  <head>
    <!-- Build: __BUILD_TIME__ -->
    <!-- Commit: __GIT_COMMIT__ -->
    <!-- Branch: __GIT_BRANCH__ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ongevallenradar</title>
  </head>
  <body>
    <div id="autocomplete">
      <label for="autocomplete-input">
        <strong>Zoek hectometerpaal</strong>
        (bijv. A12 L 53.7):
      </label>
      <div class="autocomplete-input-container">
        <input
          type="text"
          id="autocomplete-input"
          placeholder=""
          aria-label="Zoek hectometerpaal (bijv. A12 L 53.7)"
          autocomplete="on"
          class="autocomplete-input"
        />
        <button type="button"></button>
      </div>
      <ul class="autocomplete-result-list"></ul>
    </div>
    <main id="map"></main>
    <aside>
      <button id="collapse-button" aria-label="Paneel verbergen"></button>
      <h1 class="title">
        <a class="visually-hidden" href="https://www.stichtingimn.nl">Stichting incidentmanagement Nederland</a>
      </h1>
      <div id="secondaryoptions" class="flexcontainer">
        <div class="between"></div>
        <div id="filter-melder"></div>
        <div class="between"></div>
        <div id="filter-type"></div>
        <div class="between"></div>
        <div id="cirkel-pech">
          <label>
            <input id="cirkel" type="checkbox" />
            <i class="mi mi-check"></i>
            Pech en overig als cirkel
          </label>
        </div>
        <div class="between"></div>
        <div id="settings">
          <span id="save">
            <img
              src="/assets/images/save_settings.svg"
              width="32"
              height="32"
              style="cursor: pointer"
              title="opslaan instellingen"
            />
          </span>
          <span id="clear">
            <img
              src="/assets/images/reset_settings.svg"
              width="32"
              height="32"
              style="cursor: pointer"
              title="wissen instellingen"
            />
          </span>
        </div>
        <div class="between"></div>
        <button id="backtomain" title="Ga terug naar het hoofd menu">Terug naar Hoofdmenu</button>
      </div>
      <div id="mainoptions" class="flexcontainer">
        <div class="between"></div>
        <div id="layers">
          <div id="layer-body"></div>
        </div>
        <div class="between"></div>
        <div id="filter">
          <div id="filter-body">
            <select class="form-control" id="sel-rayon" multiple></select>
            <div id="filter-button">
              <img
                id="filter-button-img"
                style="cursor: pointer"
                width="50"
                height="20"
                src="/assets/images/toggle_aan.svg"
                title="zet filter op uw rayonselectie aan/uit"
              />
            </div>
          </div>
        </div>
        <div class="between"></div>
        <div id="beep">
          <span id="beep-button">
            <img
              id="beep-button-img"
              src="/assets/images/sound_on.svg"
              width="32"
              height="32"
              style="cursor: pointer"
              title="zet geluid bij nieuwe melding aan/uit"
            />
          </span>
        </div>
        <div class="between"></div>
        <div
          id="legend"
          title="Het bij elke melding gepubliceerde tijdstip betreft het moment waarop het LCM het dossier afsluit en het proces van inschakeling van de berger begint. Meldingen verschijnen in beeld met een vertraging van tien tot dertig seconden ten opzichte van het gepubliceerde tijdstip."
        >
          <table>
            <tr>
              <td><img class="legendimg" src="/assets/images/driehoek-rood.svg" /></td>
              <td class="legendtext">laatste melding</td>
            </tr>
            <tr>
              <td><img class="legendimg" src="/assets/images/driehoek-oranje.svg" /></td>
              <td class="legendtext">op &eacute;&eacute;n na laatste melding</td>
            </tr>
            <tr>
              <td><img class="legendimg" src="/assets/images/driehoek-geel.svg" /></td>
              <td class="legendtext">drie laatste meldingen daarv&oacute;&oacute;r</td>
            </tr>
            <tr>
              <td><img class="legendimg" src="/assets/images/driehoek-grijs.svg" /></td>
              <td class="legendtext">recente meldingen</td>
            </tr>
          </table>
        </div>
        <div class="between"></div>
        <div id="datetime">
          <div id="hour"></div>
          <div id="date"></div>
        </div>
        <button id="options" title="Ga naar de overige opties">Andere opties</button>
      </div>
    </aside>
    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
